# Workers AI always enables reasoning; reasoning_effort selects low|high|max and defaults to max.
# The compatibility value medium normalizes to max.
# https://docs.z.ai/guides/llm/glm-5.3-flash
name = "Glm 5.3 Flash"
description = "GLM vision model for visual reasoning, documents, and multimodal agents"
family = "glm"
release_date = "2026-08-26"
last_updated = "2026-08-26"
attachment = true
reasoning = true
temperature = true
tool_call = true
structured_output = true
open_weights = true
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[cost]
input = 0.15
output = 0.5
cache_read = 0.03

[limit]
context = 1_310_720
output = 1_310_720

[modalities]
input = ["text", "image"]
output = ["text"]
