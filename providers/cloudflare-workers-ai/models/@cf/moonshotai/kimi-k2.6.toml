# Effort: reasoning_effort = none|high; none selects instant mode.
# Source: Workers AI /ai/models/search?format=openrouter (2026-09-18).

base_model = "moonshotai/kimi-k2.6"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.95
output = 4
cache_read = 0.16

[limit]
output = 256_000

[modalities]
input = ["text", "image"]
